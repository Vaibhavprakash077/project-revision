name: Phase 12 - SSM Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0d751d582b7eba201

jobs:
  ssm_test:
    name: Test SSM Connection
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::207224908189:role/GitHubActions-OIDC-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send SSM command
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Phase 12 GitHub Actions SSM test" \
            --parameters 'commands=["echo GitHub Actions successfully reached EC2 through SSM","hostname","docker --version"]' \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        run: |
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Attempt $i — Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "SSM command succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM command failed with status: $STATUS"
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for SSM command."
          exit 1

      - name: Show SSM output
        if: always()
        run: |
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json