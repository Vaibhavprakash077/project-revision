name: python-cache

on:
  push:
    branches:
      - feature
    paths:
        - ".github/workflows/python-cache.yaml"
  workflow_dispatch:

jobs:
  JOB-A:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: cache
        uses: actions/cache@v6
        id: cache
        with:
          path: ~/.cache/pip
          key: ${{runner.os}}-${{hashFiles('requirements.txt')}}
          
          restore-keys: |
            ${{runner.os}}-
      - name: hitting
        run: echo "cache-hit = '${{ steps.cache.outputs.cache-hit }}'"
      - name: installing dependencies
        run: pip install -r requirements.txt
      - name: cache info
        run: ls -la ~/.cache/pip

