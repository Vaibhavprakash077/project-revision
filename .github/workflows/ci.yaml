name: Python-CI


env:
  APP_USER: production

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
  pull_request:
    branches:
      - main
  
  workflow_dispatch:

jobs:
  test:
    env:
      APP_USER: testing
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: environment variable check
        env:
          APP_USER: step variable
        run: echo "$APP_USER"
      - name: step variable
        run: echo "$APP_USER"
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: GITHUB SHA
        run: echo $GITHUB_SHA
      - name: GITHUB REF
        run: echo $GITHUB_REF
      - name: DEMO_SECRET VALUE
        env:
          DEMO_SECRET: ${{secrets.DEMO_SECRET}}
        run: echo $DEMO_SECRET
      - name: GITHUB TOKEN
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: echo $GITHUB_TOKEN
  security:
    runs-on: ubuntu-latest
    steps:
      - name: printing env vari
        run: echo "$APP_USER"
  build:
    runs-on: ubuntu-latest
    needs: [lint,security,test]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  failure-handler:
    runs-on: ubuntu-latest
    needs: [lint,security,test]
    steps:
      - name:  checkout ls -la
        run: ls -la 
     
  
        