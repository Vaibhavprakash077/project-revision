name: ecr.yaml

on:
  push:
    branches:
      - feature
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flask-app

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositoru
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testing
        env: 
          PYTHONPATH: .
        run: pytest --junitxml=test.xml;
      - name: uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: aritifact-push
          path: test.xml
  build_and_scan:
    name: Docker build and trivy scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: docker image
        run: docker build -t flask-app:$GITHUB_SHA .
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flask-app:$GITHUB_SHA
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  push_to_ecr:
    name: Push Image to ECR
    runs-on: ubuntu-latest
    needs: build_and_scan

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::207224908189:role/GitHubActions-OIDC-Role
          aws-region: us-east-1
      - name: Verify aws identity
        run: aws sts get-caller-identity
      - name: Login to AMazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image for ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA
      - name: Verify image exists in ECR
        env:
           IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${IMAGE_TAG} \
            --region ${{ env.AWS_REGION }}