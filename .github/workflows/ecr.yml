name: ecr.yaml

on:
  push:
    branches:
      - feature
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flask-app

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositoru
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testing
        env: 
          PYTHONPATH: .
        run: pytest --junitxml=test.xml;
      - name: uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: aritifact-push
          path: test.xml
  build_and_scan:
    name: Docker build and trivy scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: docker image
        run: docker build -t flask-app:$GITHUB_SHA .
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flask-app:${{github.sha}}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  push_to_ecr:
    name: Push Image to ECR
    runs-on: ubuntu-latest
    needs: build_and_scan

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::207224908189:role/GitHubActions-OIDC-Role
          aws-region: us-east-1
      - name: Verify aws identity
        run: aws sts get-caller-identity
      - name: Login to AMazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build image for ECR
        env: 
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t $REGISTRY/flask-app:${{github.sha}} .
      - name: Push image for ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA
      - name: Verify image exists in ECR
        env:
           IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${IMAGE_TAG} \
            --region ${{ env.AWS_REGION }}
  deploy_to_ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push_to_ecr

    permissions:
      contents: read
      id-token: write

    env:
      EC2_INSTANCE_ID: i-0d751d582b7eba201

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::207224908189:role/GitHubActions-OIDC-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through SSM
        id: deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SCRIPT_B64=$(base64 -w 0 scripts/deploy.sh)

          COMMANDS=$(jq -n \
            --arg script "$SCRIPT_B64" \
            --arg tag "$IMAGE_TAG" \
            '{
              commands: [
                "mkdir -p /opt/flask-app",
                ("echo " + $script + " | base64 -d > /opt/flask-app/deploy.sh"),
                "chmod +x /opt/flask-app/deploy.sh",
                ("/opt/flask-app/deploy.sh " + $tag)
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy flask-app $IMAGE_TAG" \
            --parameters "$COMMANDS" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        id: wait
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Attempt $i - SSM status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deployment command succeeded."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment command failed: $STATUS"
                exit 1
                ;;

              *)
                sleep 5
                ;;

            esac
          done

          echo "Timed out waiting for deployment."
          exit 1

      - name: Show deployment output
        if: always()
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          if [ -z "$COMMAND_ID" ]; then
            echo "No SSM command ID was created."
            exit 0
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query '{
              Status:Status,
              ResponseCode:ResponseCode,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }' \
            --output json