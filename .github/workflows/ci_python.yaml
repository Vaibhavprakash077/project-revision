name: ci_python

env:
  APP_ENV: app

on:
  push:
    branches:
      - main
      - feature
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  test:
   runs-on: ubuntu-latest
   env:
     APP_ENV: appclass
   steps:
     - name: enviorment check
       env:
         APP_ENV: appclass2
       run: echo $APP_ENV
     - name: GITHUB_REF
       run: echo $GITHUB_REF
     - name: checkout repo
       uses: actions/checkout@v4
     - name: setup python
       uses: actions/setup-python@v6
       with:
         python-version: "3.12"
         cache: "pip"
         cache-dependancy-path: requirements.txt
     - name: dowloading dependancy
       run: pip install -r requirements.txt
     - name: Linting
       run: ruff check .
     - name: testing
       env:
         PYTHONPATH: .
       run: pytest --junitxml=test-results.xml
     - name: uploading artifact
       uses: actions/upload-artifact@v5
       with:
         name: Python_artifact
         path: test-results.xml
  docker:
   runs-on: ubuntu-latest
   needs: test
   permissions:
     contents: read
   steps:
     - name: checkout repo
       uses: actions/checkout@v4
     - name: docker build
       run: docker build -t flask-app:$GITHUB_SHA .
     - name: container start
       run: docker run -d --name ci_python -p 8000:8000 flask-app:$GITHUB_SHA
     - name: Container smoke test
       run: |
          for i in {1..15}; do
            echo "Attempt $i: checking app..."
            response=$(curl -s -o body.txt -w "%{http_code}" http://localhost:8000 || true)

            if [ "$response" = "200" ] && grep -q "Hello from Docker!" body.txt; then
              echo "✅ Application is reachable and responded correctly"
              docker rm -f ci_python
              exit 0
            fi

            sleep 2
          done

          echo "❌ Application did not become ready"
          docker logs ci_python
          docker rm -f ci_python
          exit 1
     - name: container state
       if: failure()
       run: docker ps -a
     - name: docker logs
       if: failure()
       run: docker logs ci_python
     

  aws:
   runs-on: ubuntu-latest
   env:
     AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
     AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
   steps:
     - name: aws sts caller
       run: aws sts get-caller-identity
     - name: listing S3
       run: aws s3 ls
     
