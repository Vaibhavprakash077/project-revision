name: python-cache

on:
  push:
    branches:
      - feature
  workflow_dispatch:

jobs:
  JOB-A:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: cache
        uses: actions/cache@v6
        id: cache
        with:
          path: cache-data
          key: linux-demo-cache-v2
      - name: creating dir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir cache-data
          echo "HELLO CACHE"> cache-data/message.txt
      - name: cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: cat cache-data/message.txt
      - name: content
        run: cat cache-data/message.txt
      
