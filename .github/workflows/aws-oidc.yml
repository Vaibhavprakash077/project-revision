name: aws-oidc

on:
  push:
    branches:
      - feature

jobs:
  aws-oidc:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
        - name: checkout repo
          uses: actions/checkout@v4
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: arn:aws:iam::207224908189:role/GitHubActions-OIDC-Role
            aws-region: us-east-1
        - name: Verify AWS identity
          run: aws sts get-caller-identity
        - name: list s3
          run: aws s3 ls

