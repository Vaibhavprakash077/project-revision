name: python-cache

on:
  push:
    branches:
      - feature
    paths:
        - ".github/workflows/python-cache.yaml"
  workflow_dispatch:

jobs:
  JOB-A:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: cache
        uses: actions/cache@v6
        id: cache
        with:
          path: cache-data
          #key: ${{runner.os}}-${{hashFiles('requirements.txt')}}
          key: linux-demo-v4
          restore-keys: |
           linux-demo-v2
           linux-demo-
           linux-
      - name: hitting
        run: echo "cache-hit = '${{ steps.cache.outputs.cache-hit }}'"
      - name: content
        run: cat cache-data/message.txt
      
